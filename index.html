<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MyAI</title>
<link rel="icon" type="image/png" href="icon-192.png" />
<link rel="manifest" href="manifest.webmanifest" />
<meta name="theme-color" content="#000000" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black" />
<link rel="apple-touch-icon" href="icon-192.png" />

<style>
/* ─────────────── RESET & BASE ─────────────── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:#000;color:#fff;font:16px/1.5 system-ui,sans-serif;text-align:center;padding:2em 1em 200px}
button{cursor:pointer;border:0;border-radius:0;background:#000;color:#fff;transition:background .2s,border-color .2s}
button:hover:not(:disabled){background:#333}
button:disabled{opacity:.5;cursor:not-allowed}

/* ─────────────── RECORD LIST ─────────────── */
.rec-list{list-style:none;margin:0 auto;padding:0;max-width:820px}
.rec-item{display:flex;flex-direction:column;gap:10px;padding:24px 0;border-bottom:1px solid #333;text-align:left;}
.rec-top{display:flex;align-items:center;gap:12px; margin-bottom:4px;}

/* Beautiful Native Audio Player */
.rec-player{width:100%; background:#111; padding:8px; border-radius:12px; border:1px solid #333}
.rec-player audio{width:100%; height:44px; outline:none;}
.rec-player audio::-webkit-media-controls-panel { background-color: #222; }
.rec-player audio::-webkit-media-controls-current-time-display,
.rec-player audio::-webkit-media-controls-time-remaining-display { color: #fff; }

/* Live in-recording playback preview (active recording row) */
.live-rec-badge{display:inline-flex;align-items:center;gap:6px;color:#4caf50;font:bold 12px/1 monospace;letter-spacing:.08em;padding:3px 9px;border:1px solid #2a6b3a;border-radius:999px;background:#071209}
.live-rec-badge .dot{width:7px;height:7px;border-radius:50%;background:#4caf50;animation:pulse-dot 1.2s ease-in-out infinite}
.rec-player-live{border-color:#2a6b3a;box-shadow:inset 0 0 0 1px rgba(76,175,80,.18)}
.live-rec-meta{font:12px/1.4 monospace;color:#9a9a9a;padding:2px 2px 0}

.rec-filename{flex:1 1 320px;min-width:0;background:0;border:none;color:inherit;font:inherit;font-weight:bold;font-size:1.1em; letter-spacing: 0.5px;}

/* ─────────────── CONSOLIDATED ACTION PANELS ─────────────── */
.action-panel { background: #151515; padding: 12px; border-radius: 10px; border: 1px solid #333; margin-top: 8px; }
.action-panel .btn-row { display: flex; gap: 8px; margin-bottom: 8px; }
.action-panel .btn-row button { flex: 1; }
.action-panel .drop-row { display: flex; gap: 6px; }

.action-btn { border: 1px solid #555; border-radius: 6px; padding: 8px; color: #fff; font-weight: bold; font-size: 14px; font-family: monospace; text-align: center; }
.action-btn.processing { color:#ffc107 !important; border-color:#ffc107 !important; opacity:.75; cursor:progress; }

/* Scribe buttons */
.btn-ls { border-color: #00bcd4; color: #00bcd4; }
.btn-rs { border-color: #ffa726; color: #ffa726; }

/* Reply buttons */
.btn-la { border-color: #00bcd4; color: #00bcd4; }
.btn-ra { border-color: #ffa726; color: #ffa726; }

.action-drop { background: #0a0a0a; border: 1px dashed #555; color: #ccc; border-radius: 6px; padding: 6px; font-family: monospace; font-size: 13px; cursor: pointer; flex:1; width: 0; text-overflow: ellipsis; }
.action-drop option { background: #111; color: #fff; }

/* ─────────────── CONTEXT CHAIN ─────────────── */
.context-chain { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
.context-chain-header { font-size: 11px; font-family: monospace; color: #4caf50; padding: 6px 10px; background: #071209; border: 1px solid #2a6b3a; border-radius: 8px; display: flex; gap: 12px; align-items: center; }
.context-chain-header span { opacity: 0.7; }
.context-item { background: #0a1a0f; border: 1px solid #2a6b3a; padding: 8px 10px; border-radius: 8px; }
.context-item-title { font-size: 11px; color: #4caf50; font-family: monospace; font-weight: bold; cursor: pointer; display: inline-block; margin-bottom: 5px; }
.context-item-title:hover { color: #81c784; text-decoration: underline; }
.context-item-row { display: flex; gap: 6px; align-items: stretch; }
.context-preview { background: #050f08; border: 1px dashed #2a6b3a; color: #6abf72; border-radius: 6px; padding: 6px 8px; font-family: monospace; font-size: 12px; flex: 1; overflow-y: auto; max-height: 60px; white-space: pre-wrap; word-break: break-word; }
.btn-unlink { border: 1px solid #6b2a2a; color: #d9534f; border-radius: 6px; padding: 4px 8px; font-size: 13px; flex-shrink: 0; background: #1a0808; }
.btn-unlink:hover { background: #2a1010; color: #ff6b68; border-color: #ff6b68; }

.bottom-actions { display: flex; gap: 8px; margin-top: 8px; width: 100%; }
.bottom-actions button { flex: 0 0 calc(25% - 6px); padding: 10px; border-radius: 8px; font-weight: bold; transition: 0.2s; border-style: dashed; border-width: 1px; font-size: 14px; }
.btn-continue { background: #0d2b14; border-color: #4caf50; color: #4caf50; }
.btn-continue:hover { background: #163d1e; color: #81c784; border-color: #81c784; }
.btn-delete { background: #2a1111; border-color: #d9534f; color: #d9534f; }
.btn-delete:hover { background: #3a1111; color: #fff; border-color: #ff6b68; }

.ctx-part-box { border-radius: 6px; padding: 6px 8px; margin-top: 5px; }
.ctx-input-box  { background: #050f08; border: 1px solid #1a4a26; }
.ctx-output-box { background: #0a0f05; border: 1px solid #2a4a10; }
.ctx-size-label { font-size: 11px; font-family: monospace; color: #3a7a4a; flex-shrink: 0; align-self: center; padding: 0 4px; white-space: nowrap; }

.sel-row { display: flex; gap: 6px; align-items: center; margin-bottom: 5px; }
.sel-row .action-drop { flex: 1; }
.sel-preview { background: #070707; border: 1px dashed #2a2a2a; border-radius: 6px; padding: 6px 8px; cursor: pointer; transition: border-color .15s; display: flex; flex-direction: column; gap: 2px; }
.sel-preview:hover { border-color: #555; }
.sel-preview-text { color: #999; font-family: monospace; font-size: 12px; line-height: 1.5; white-space: pre-wrap; word-break: break-word; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.sel-preview:hover .sel-preview-text { color: #bbb; }
.sel-preview-foot { display: flex; justify-content: flex-end; }
.btn-copy { background: none; border: 1px solid transparent; border-radius: 4px; color: #444; font-size: 13px; padding: 1px 5px; cursor: pointer; transition: .15s; flex-shrink: 0; }
.btn-copy:hover { color: #aaa; border-color: #444; }

/* ─────────────── COMPACT MODE ─────────────── */
body.compact .action-panel { border: none; background: none; padding: 0; margin: 0; }
body.compact .action-panel:not(:has(.sel-preview)):not(:has(.live-status)):not(:has(.btn-row)) { display: none; }

/* Live status bar — visible in compact mode during processing. The main area
   is tappable (opens the live tab); the ✕ cancels the running job. */
.live-status { padding: 8px 10px; border-radius: 8px; font: bold 13px/1.4 monospace; transition: .15s; display: flex; align-items: center; gap: 8px; justify-content: space-between; }
.live-status-main { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 0; cursor: pointer; }
.live-status-text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.live-status-cancel { background: transparent; border: 1px solid currentColor; color: inherit; border-radius: 6px; width: 24px; height: 24px; font-size: 11px; line-height: 1; display: flex; align-items: center; justify-content: center; padding: 0; opacity: .7; flex-shrink: 0; }
.live-status-cancel:hover { opacity: 1; background: rgba(255,255,255,.08); }
.live-status-scribe { background: #0a1a1f; border: 1px solid #00bcd4; color: #00bcd4; }
.live-status-scribe:hover { background: #0f2a33; }
.live-status-reply { background: #1a1400; border: 1px solid #ffa726; color: #ffa726; }
.live-status-reply:hover { background: #2a1e00; }
.live-status .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; animation: pulse-dot 1.2s ease-in-out infinite; flex-shrink: 0; }
@keyframes pulse-dot { 0%,100% { opacity: .3; } 50% { opacity: 1; } }

.item-card-list { display: flex; flex-direction: column; gap: 5px; margin-top: 6px; }
.item-card-header { display: flex; gap: 8px; align-items: center; margin-bottom: 3px; }
.item-card-header-label { font-size: 11px; font-family: monospace; color: #555; flex: 1; }
.item-card-header-kb { font-size: 11px; font-family: monospace; color: #444; }
.item-card { background: #0d0d0d; border: 1px solid #2a2a2a; border-radius: 8px; padding: 6px 8px; }
.item-card-title { font-size: 11px; font-family: monospace; color: #666; margin-bottom: 4px; cursor: default; }
.item-card-row { display: flex; gap: 5px; align-items: stretch; }
.item-card-preview { background: #070707; border: 1px dashed #333; color: #aaa; border-radius: 5px; padding: 5px 7px; font-family: monospace; font-size: 12px; flex: 1; overflow-y: auto; max-height: 56px; white-space: pre-wrap; word-break: break-word; line-height: 1.4; }
.item-card-select { background: #0a0a0a; border: 1px solid #333; color: #ccc; border-radius: 5px; padding: 4px 6px; font-family: monospace; font-size: 12px; width: 100%; margin-bottom: 4px; cursor: pointer; }
.item-card-select option { background: #111; }
.btn-item-del { border: 1px solid #6b2a2a; color: #d9534f; border-radius: 5px; padding: 4px 7px; font-size: 12px; flex-shrink: 0; background: #1a0808; }
.btn-item-del:hover { background: #2a1010; color: #ff6b68; border-color: #ff6b68; }
.btn-item-view { border: 1px solid #333; color: #888; border-radius: 5px; padding: 4px 7px; font-size: 12px; flex-shrink: 0; background: #0a0a0a; }
.btn-item-view:hover { border-color: #666; color: #ccc; }

/* ─────────────── SETTINGS ─────────────── */
#settingsBtn{position:absolute;top:14px;left:14px;z-index:200;background:#111;border:1px solid #444;border-radius:50%;width:40px;height:40px;font-size:20px;display:flex;align-items:center;justify-content:center;padding:0;transition:.2s}
#settingsBtn:hover{background:#222;border-color:#888}
#settingsOverlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:300;align-items:flex-start;justify-content:center;padding-top:60px}
#settingsOverlay.open{display:flex}
#settingsPanel{background:#111;border:1px solid #444;border-radius:16px;padding:20px;width:min(420px,92vw);max-height:82vh;overflow-y:auto;text-align:left;display:flex;flex-direction:column;gap:14px}
#settingsPanel h2{font-size:15px;color:#ccc;font-family:monospace;letter-spacing:.05em;margin:0}
.settings-header{display:flex;align-items:center;justify-content:space-between}
.settings-header h2{margin:0}
#settingsX{background:transparent;border:1px solid #555;color:#aaa;border-radius:6px;width:30px;height:30px;font-size:16px;display:flex;align-items:center;justify-content:center;padding:0;flex-shrink:0}
#settingsX:hover{background:#222;color:#fff;border-color:#888}
.settings-row{display:flex;flex-direction:column;gap:5px}
.settings-label{font-size:12px;color:#888;font-family:monospace}
.settings-select{background:#0a0a0a;border:1px solid #444;color:#fff;border-radius:6px;padding:7px 10px;font-family:monospace;font-size:13px}
.settings-input{background:#0a0a0a;border:1px solid #444;color:#fff;border-radius:6px;padding:7px 10px;font-family:monospace;font-size:13px;width:100%}
.settings-textarea{background:#0a0a0a;border:1px solid #444;color:#ccc;border-radius:6px;padding:8px;font-family:monospace;font-size:12px;resize:vertical;min-height:80px;width:100%}
.settings-inline{display:flex;gap:6px;align-items:center}
.settings-inline .settings-select{flex:1;min-width:0}
.settings-refresh{border:1px solid #444;background:#0a0a0a;color:#ccc;border-radius:6px;width:38px;height:38px;font-size:15px;flex-shrink:0;display:flex;align-items:center;justify-content:center;padding:0}
.settings-refresh:hover{background:#222;border-color:#888}
.settings-hint{font-size:11px;color:#666;font-family:monospace;word-break:break-word}
.settings-divider{border:none;border-top:1px solid #333;margin:2px 0}
.settings-section-label{font-size:11px;color:#666;font-family:monospace;letter-spacing:.08em;text-transform:uppercase}
.settings-danger-row{display:flex;gap:8px}
.settings-danger-btn{flex:1;padding:9px;border-radius:8px;font-size:13px;font-family:monospace;font-weight:bold;border:1px dashed}
.btn-del-audio{border-color:#d9534f;color:#d9534f;background:#1a0808}
.btn-del-audio:hover{background:#2a1010;color:#ff6b68}
.btn-del-text{border-color:#ffa726;color:#ffa726;background:#1a1000}
.btn-del-text:hover{background:#2a1a00;color:#ffc55a}
#settingsClose{align-self:flex-end;background:transparent;border:1px solid #555;color:#aaa;border-radius:6px;padding:5px 14px;font-size:13px}
#settingsClose:hover{background:#222;color:#fff}

#pagination{margin-top:1em}
#pagination button{margin:0 .3em; padding:10px;}
#pageInfo{margin:0 .3em}

/* ─────────────── FOOTER / RECORDER ─────────────── */
#recordBtn{padding:1em;border:none;border-radius:34px;font-size:1.25em;font-weight:bold;background:#d9534f;margin-bottom:10px}
#recordBtn:hover{background:#c14440}
#recordBtn.recording{background:#4caf50}
#recordBtn.recording:hover{background:#449d48}

#visualizer{display:none;width:100%;height:160px;border-radius:14px;background:#000;cursor:pointer}
#visualizer.fullscreen{position:fixed;inset:0;width:100vw;height:100vh;border-radius:0;z-index:500;cursor:pointer}
#fpsDisplay{position:absolute;top:6px;right:8px;padding:3px 7px;background:rgba(0,0,0,.6);border-radius:6px;font:12px/1.4 monospace;pointer-events:none;color:#0f9;display:none}
#fpsDisplay.fullscreen{z-index:501}

#footer{position:fixed;left:5%;right:5%;margin:auto;bottom:0;background:transparent;padding:0;border-radius:0;box-shadow:none;display:flex;flex-direction:column;align-items:center;max-width:420px;gap:0;pointer-events:none}
#footer.recording{background:#111;padding:14px 16px 18px;border-radius:24px 24px 0 0;box-shadow:0 -2px 10px rgba(0,0,0,.5);pointer-events:all}
#footer-inner{pointer-events:all;display:flex;flex-direction:column;align-items:center;gap:12px;width:100%;position:relative}
@media (min-width: 600px) { #footer { left: 30%; right: 30%; } }
</style>
</head>
<body>

<button id="settingsBtn" title="Settings" aria-label="Open settings">⚙️</button>

<div id="settingsOverlay">
  <div id="settingsPanel">
    <div class="settings-header">
      <h2>⚙️ Settings</h2>
      <button id="settingsX" onclick="closeSettings()" title="Close" aria-label="Close settings">✕</button>
    </div>
    <div class="settings-row">
      <div class="settings-label">Auto-transcribe after recording</div>
      <select class="settings-select" id="set-auto-transcribe">
        <option value="none">None</option>
        <option value="local">💻 On-Device (Local)</option>
        <option value="remote">☁️ Cloud (Remote)</option>
      </select>
    </div>
    <div class="settings-row">
      <div class="settings-label">Auto-reply after transcription</div>
      <select class="settings-select" id="set-auto-reply">
        <option value="none">None</option>
        <option value="local">💻 On-Device (Local)</option>
        <option value="remote">☁️ Cloud (Remote)</option>
      </select>
    </div>
    <div class="settings-row">
      <div class="settings-label">Compact GUI</div>
      <select class="settings-select" id="set-compact-mode">
        <option value="on">On — simplified view (default)</option>
        <option value="off">Off — show all buttons &amp; dropdowns</option>
      </select>
    </div>
    <div class="settings-row">
      <div class="settings-label">Transcription language</div>
      <select class="settings-select" id="set-transcribe-lang">
        <option value="auto">Auto-detect (keep spoken language)</option>
        <option value="en">English</option>
        <option value="nl">Dutch / Nederlands</option>
        <option value="de">German / Deutsch</option>
        <option value="fr">French / Français</option>
        <option value="es">Spanish / Español</option>
        <option value="it">Italian / Italiano</option>
        <option value="pt">Portuguese / Português</option>
        <option value="pl">Polish / Polski</option>
        <option value="ru">Russian / Русский</option>
        <option value="tr">Turkish / Türkçe</option>
        <option value="ar">Arabic / العربية</option>
        <option value="hi">Hindi / हिन्दी</option>
        <option value="zh">Chinese / 中文</option>
        <option value="ja">Japanese / 日本語</option>
        <option value="ko">Korean / 한국어</option>
      </select>
    </div>
    <hr class="settings-divider">
    <div class="settings-row">
      <div class="settings-label">Default AI instructions for all conversations</div>
      <textarea class="settings-textarea" id="set-ai-instructions" placeholder="e.g. Always reply in Dutch. Be concise. Focus on action items."></textarea>
    </div>
    <hr class="settings-divider">
    <div class="settings-section-label">☁️ Remote servers</div>
    <div class="settings-row">
      <div class="settings-label">Ollama model (remote reply)</div>
      <div class="settings-inline">
        <select class="settings-select" id="set-ollama-model" aria-label="Ollama model"></select>
        <button class="settings-refresh" onclick="refreshOllamaModels()" title="Reload model list from server" aria-label="Reload model list from server">🔄</button>
      </div>
      <div class="settings-hint" id="ollama-model-status">Open settings to load installed models…</div>
    </div>
    <hr class="settings-divider">
    <div class="settings-danger-row">
      <button class="settings-danger-btn btn-del-audio" onclick="deleteAllAudio()">🗑️ Delete All Audio</button>
      <button class="settings-danger-btn btn-del-text" onclick="deleteAllText()">🧹 Delete All Text</button>
    </div>
    <button id="settingsClose" onclick="closeSettings()">Close</button>
  </div>
</div>

<div id="main-ui">
  <button id="recordBtn">Start Recording</button>
  <div id="storage-info" style="margin-bottom:1em;font-weight:bold;color:#888;">Audio stored: 0 B</div>

  <ul id="recordingsList" class="rec-list"></ul>

  <div id="pagination" hidden>
    <button id="prevPageBtn" style="font-size:30px;">« Prev</button>
    <span id="pageInfo" style="font-size:30px;"></span>
    <button id="nextPageBtn" style="font-size:30px;">Next »</button>
  </div>

  <div id="footer">
    <div id="footer-inner">
      <div style="position:relative;width:100%" id="viz-wrap">
        <canvas id="visualizer" title="Tap to fullscreen"></canvas>
        <div id="fpsDisplay">FPS: --</div>
      </div>
    </div>
  </div>
</div>

<!-- Screen wake-lock is handled natively in js/wake-lock.js (imported as a
     module by the recorder) — no external library, no <script> tag needed. -->
<script type="module" src="js/main.js"></script>
</body>
</html>
